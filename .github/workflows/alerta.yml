name: Alerta de Push a Main

on:
  push:
    branches:
      - main

jobs:
  build-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar Hola Mundo
        run: node app.js

      - name: Enviar notificación a ntfy.sh
        if: success()
        run: |
          curl -H "Title: Nuevo push de ${{ github.actor }}" \
               -H "Priority: high" \
               -H "Tags: white_check_mark" \
               -d "Hola, soy ${{ github.actor }} y subí los cambios a la rama main del repositorio ${{ github.repository }}. El workflow corrió correctamente." \
               https://ntfy.sh/devops-itla